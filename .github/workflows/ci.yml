name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youtube_edu_controller
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # pubspec.yaml이 Dart ^3.9.2를 요구하고 소스가 RadioGroup(Flutter 3.35+)을
          # 사용하므로 버전을 고정하지 않고 최신 stable을 사용한다.
          # (기존 3.24.x 고정은 Dart 3.5.4를 설치해 pub get 단계에서 항상 실패했음)
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Create .env for CI
        run: |
          echo "YOUTUBE_API_KEY=CI_DUMMY_KEY" > .env
          echo "OPENAI_API_KEY=YOUR_OPENAI_API_KEY" >> .env

      - run: flutter analyze --no-fatal-infos

      - run: flutter test

  # analyze/test로는 잡히지 않는 Android 빌드 문제(Gradle·AGP·Kotlin 최소 버전,
  # namespace와 MainActivity 패키지 불일치 등)를 PR 단계에서 잡기 위한 빌드 검증.
  # analyze-and-test와 병렬로 실행되어 기존 검사 시간에 영향을 주지 않는다.
  android-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youtube_edu_controller
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Create .env for CI
        run: |
          echo "YOUTUBE_API_KEY=CI_DUMMY_KEY" > .env
          echo "OPENAI_API_KEY=YOUR_OPENAI_API_KEY" >> .env

      # google-services.json은 .gitignore 대상이라 저장소에 없다.
      # google-services Gradle 플러그인 통과용 더미 파일 (package_name은 applicationId와 일치해야 함)
      - name: Create dummy google-services.json for CI
        run: |
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-dummy",
              "storage_bucket": "ci-dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.qbeen.app" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "CI_DUMMY_KEY" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Build debug APK
        run: flutter build apk --debug
