name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youtube_edu_controller
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # pubspec.yaml이 Dart ^3.9.2를 요구하고 소스가 RadioGroup(Flutter 3.35+)을
          # 사용하므로 버전을 고정하지 않고 최신 stable을 사용한다.
          # (기존 3.24.x 고정은 Dart 3.5.4를 설치해 pub get 단계에서 항상 실패했음)
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Create .env for CI
        run: |
          echo "YOUTUBE_API_KEY=CI_DUMMY_KEY" > .env
          echo "OPENAI_API_KEY=YOUR_OPENAI_API_KEY" >> .env

      - run: flutter analyze --no-fatal-infos

      - run: flutter test
